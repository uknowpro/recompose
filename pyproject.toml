[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recompose"
version = "0.4.0"
description = "Plan Java container-to-VM migrations"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
recompose = "recompose.cli:main"

[tool.setuptools.packages.find]
include = ["recompose*"]
